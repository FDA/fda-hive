<script type="application/javascript">

var obj_type = docLocValue("type");
var obj_svc = docLocValue("svc");

var thisProcessID = docLocValue("id");
if( !thisProcessID ) {
    thisProcessID = 0;
    if( !obj_type || !obj_svc ) {
        console.log("Request missing object 'type' or 'svc' parameter");
    }
    vjDS.add("Retrieving metadata definition", "dsPropSpecJson", "http:
} else {
    vjDS.add("Retrieving list of downloadable files", "dsAllDownloads",
            "http:
    vjDS.add("Retrieving metadata definition", "dsPropSpecJson", "http:
}


var algoProcess = new valgoProcess(thisProcessID, obj_svc, obj_type);
algoProcess.visibleParameters = ["name"];
algoProcess.autoexpand = thisProcessID.length ? "all" : 1;
algoProcess.noResultViewers = true;

function findSvcHttpPostObjId(uniq_upid)
{
    linkCmd('objQry&raw=1&qry=alloftype("^svc-http-post$",{unique_upload_id:"' + uniq_upid + '"})[0]',
        "",
        function(param, text) {
            if( text ) {
                document.location = urlExchangeParameter(document.location, 'id', text);
            }
            setTimeout(function(){findSvcHttpPostObjId(uniq_upid)}, 3000);
        }
    );
}

algoProcess.onRedirectProcSubmitted = function(param, text)
{
}

algoProcess.doneComputing = function (viewer, reqid, stat)
{
    if(obj_type == "svc-http-post" && stat == 5) {
        linkCmd('objQry&raw=1&qry=((obj)'+thisProcessID+').procid',
                "",
                function(param, text) {
                    if( text ) {
                        document.location = urlExchangeParameter(document.location, 'id', text);
                    }
                    setTimeout(function(){findSvcHttpPostObjId(uniq_upid)}, 3000);
                }
            );
    }
    else if (obj_type && stat>=5) {
        if ( vjHO && vjHO[obj_type] ) {
            currentCompletionState = "computed";
            algoWidgetObj.iterateAlgoJSON (algoWidgetObj.optionsForPage.subTabs, "algoMenu");
            var node = {
                _type : obj_type,
                id : docLocValue("id"),
            };
            vjHO.fullview(node._type, node, $.getAlgoViewManager().options.jsonForPage.subTabs.results);
        }
    }
}

gInitList += "hive_Init();";

function hive_Init () {
    var use_frame_post = false;
    vjDS["dsPropSpecJson"].register_callback(function(params, data, page_request) {
        propspec = { title: "Invalid format" };
        try {
            propspec = JSON.parse(data);
        } catch (err) {
            console.log("Invalid JSON syntax");
        }
        function get_own_fields(obj, own_fields) {
            if (!own_fields) {
                own_fields = [];
            }
            if (obj && obj._field) {
                Object.keys(obj._field).forEach(function(name)
                {
                    var field = obj._field[name];
                    if (!field.__definer_type && !field._hidden) {
                        own_fields.push({name: name, field: field});
                    }
                    if (field.__definer_type && field._field) {
                        get_own_fields(field, own_fields);
                    }
                    if (field._type == "file") {
                        use_frame_post = true;
                    }
                });
            }
            return own_fields;
        }
        obj_type = propspec.name;
        algoProcess.svcProcType = obj_type;
        setLocationTitle(propspec.title);
        var own_fields = get_own_fields(propspec);
        own_fields.sort(function(a, b) {
            var diff = parseFloat(a.field._order) - parseFloat(b.field._order);
            if (diff < 0 || diff > 0) {
                return diff;
            }
            if (a.name < b.name) {
                return -1;
            } else if (a.name > b.name) {
                return 1;
            }
            return 0;
        });
        if( use_frame_post ) {
            algoProcess.submit = function()
            {
                var uniq_upid = new Date().getTime() + Math.random() * 1e6;
                var cr_viewer = vjDV[algoProcess.recViewerName];
                if( cr_viewer ) {
                    cr_viewer.cmdPropSet = "hive.cgi?cmd=usave&debug=" + docLocValue("debug") + "&svc=" + encodeURIComponent(obj_svc) + "&unique_upload_id=" + encodeURIComponent(uniq_upid);
                    cr_viewer.saveValues(null, "FormData", "function:vjObjFunc('onRedirectProcSubmitted','" + algoProcess.objCls + "')");
                    findSvcHttpPostObjId(uniq_upid);
                }
            }
        }
        algoProcess.visibleParameters = algoProcess.visibleParameters.concat(own_fields.map(function(named_field) {
            return named_field.name;
        }));
        algoProcess.visibleParameters.push("folder");
        globalAlgo = $('#mainAlgoArea').algoview({
            algoObj: algoProcess,
            svcType: obj_type,
            algoTitle: propspec.title
        });
    });
    vjDS["dsPropSpecJson"].load();
};

</script>
