<script type="application/javascript">

    setLocationTitle("Kraken Service: HIVE");
    
    google.load("visualization", "1", { packages : [ "corechart" ] });
    
    var thisProcessID=docLocValue("id"); if(!thisProcessID) thisProcessID=0;
    var algoProcess=new valgoProcess(thisProcessID,  "dna-kraken", "svc-dna-kraken");
    algoProcess.visibleParameters=["name","inputs","DB"];
    algoProcess.submitButtonName="Submit";
    algoProcess.initialPresets={
        "sysapp":"query:alloftype('sysappdep',{name:'dna-kraken'})[0]",
        "sysdocker":"query:alloftype('sysdocker',{name:'kraken-metaphlan-image'})[0]",
        "DB":"query:alloftype('special',{name:'krakenDB'})[0]"
    };     
    
    gInitList += "dnaKrakenInit();";
    function dnaKrakenInit () {
        var topVal = $("#header").height() + 45;
        
        globalAlgo = $('#mainAlgoArea').algoview({
            algoObj: algoProcess,
            svcType: 'svc-dna-kraken',
            algoTitle: "Kraken Utility"
        });
        
    };
</script>
