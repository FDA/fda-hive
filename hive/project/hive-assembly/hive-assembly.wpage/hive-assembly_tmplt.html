<script type="application/javascript">

    setLocationTitle("DNA Assembly: HIVE");
    
    google.load("visualization", "1", { packages : [ "corechart" ] });
    
            
    
    var thisProcessID=docLocValue("id"); if(!thisProcessID) thisProcessID=0;
    var algoProcess=new valgoProcess(thisProcessID,  "hive-assembly", "svc-hive-assembly-clfow");
    
    algoProcess.visibleParameters=["name","reads","reference_genome","clone_params"];
     
    algoProcess.submitButtonName="Submit";

    algoProcess.initialPresets={pipeline:"query:alloftype('workflow',{name:'hive-assembly'})"};   
    
    
     algoProcess.inputLoaded = function (viewer, elem){
    } 
    algoProcess.inputChanged= function (viewer, elem){
         if(thisProcessID && thisProcessID.indexOf("-") != 0)
            return ;
    }
    
    
    gInitList += "antidoteInit();";
    function antidoteInit() {
        var topVal = $("#header").height() + 45;
        
        globalAlgo = $('#mainAlgoArea').algoview({
            algoObj: algoProcess,
            svcType: 'svc-hive-assembly-clfow',
            algoTitle: "HIVE-Assembly CFlow"
        });
        
    };
</script>
